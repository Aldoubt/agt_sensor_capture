name: static-contracts

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest pyyaml
      - run: python -m pytest -q test
      - run: python -m py_compile src/agt_capture_bringup/launch/*.py tools/*.py
